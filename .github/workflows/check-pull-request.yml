name: Check pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:mc
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm check:expanded
      - run: pnpm check:potion
      - run: pnpm check:player
      - run: pnpm check:audit
      - run: pnpm check:deep
      - run: pnpm check:third
      - run: pnpm check:fourth
      - run: pnpm check:fifth
      - run: python3 scripts/verify-mc-fifth-zips.py
      - run: pnpm check:sixth
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: pnpm check:native
